[project]
name = "payments-ledger-engine"
version = "0.1.0"
description = "Production-like payments ledger with idempotency and versioned cache."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.17.2",
  "psycopg>=3.3.2",
  "greenlet>=3.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["F401"]

[tool.ruff.format]
exclude = ["alembic/versions/*.py"]

[dependency-groups]
dev = [
    "bandit>=1.9.3",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
]

[tool.ruff]
line-length = 100
exclude = ["alembic/versions/*.py"]

[tool.mypy]
python_version = "3.12"
plugins = ["sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true
pretty = true
